name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:2025.10.1
        env:
          NEO4J_AUTH: none
          NEO4J_server_memory_heap_initial__size: 128m
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
    env:
      WEKNORA_NEO4J_TEST_URI: bolt://127.0.0.1:7687
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify generated model catalog
        run: python3 scripts/model-catalog/generate.py --check

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Graph regression race tests against live Neo4j
        run: |
          go test -race -count=1 ./internal/application/repository/retriever/neo4j ./internal/types ./internal/agent/tools ./internal/application/service/chat_pipeline ./internal/modelcontext

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"
          go test -tags desktop ./internal/container

      - name: Build server
        run: go build ./cmd/server
